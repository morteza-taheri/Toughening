; TOUGHENING MACHINE — Phase 2B firmware skeleton build environment
;
; PROPOSED — NOT APPROVED. Compile only: this project does not upload,
; flash, or interact with hardware.
;
; Version pinning is deliberately NOT set here. PlatformIO resolves the
; platform and framework at build time; the resolved lock is reported
; separately. Do not add pin/version constants to this file without an
; explicit user decision.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; No GPIO numbers, no pin assignments, no hardware constants.
; Acquisition architecture is OPEN (HW-02, HW-03, HW-14); see
; src/main.cpp for the full list of items this skeleton does not decide.