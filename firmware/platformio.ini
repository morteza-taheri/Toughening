; Toughening Machine ESP32 firmware
; Phase 2D-1 (+ review fixes 2026-10-10)
;
;   pio run -e esp32dev               production build (default)
;   pio run -e esp32dev -t upload     flash firmware
;   pio run -e esp32dev -t uploadfs   flash the web UI (firmware/data -> SPIFFS)
;   pio run -e esp32dev_devpw         DEVELOPMENT build: random password is
;                                     always shown (Serial + login page) and
;                                     the developer master password is active.
;                                     NEVER deploy this build.

[platformio]
default_envs = esp32dev

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = spiffs

lib_deps =
    links2004/WebSockets @ ^2.4.1
    ESP32Async/ESPAsyncWebServer @ ^3.7.0
    ESP32Async/AsyncTCP @ ^3.4.0
    bblanchon/ArduinoJson @ ^7.0.0

[env:esp32dev]
build_flags =
    -DTM_DEV_SHOW_PASSWORD=0

[env:esp32dev_devpw]
build_flags =
    -DTM_DEV_SHOW_PASSWORD=1
