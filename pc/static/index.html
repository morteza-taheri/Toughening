<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="app.title">Toughening Machine</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1 data-i18n="app.title">Toughening Machine</h1>
    <nav>
      <button id="lang-toggle" data-i18n="header.languageToggle.whenEn">فارسی</button>
      <button id="calendar-toggle" data-i18n="header.calendarToggle.whenGregorian">شمسی</button>
    </nav>
  </header>

  <main>
    <section class="panel">
      <h2 data-i18n="panel.live.title">Live</h2>
      <div id="live-status" data-i18n="live.status.waiting" class="live-status">Waiting for connection...</div>
      <div class="live-table-wrap">
        <table id="live-values">
          <tbody>
            <tr>
              <th data-i18n="live.table.event_time">Event time</th>
              <td id="live-event-time" data-i18n="live.value.none">—</td>
            </tr>
            <tr>
              <th data-i18n="live.table.station_count">Station count</th>
              <td id="live-station-count" data-i18n="live.value.none">—</td>
            </tr>
            <tr>
              <th data-i18n="live.table.invalid_channel_count_now">Invalid channels</th>
              <td id="live-invalid-channel-count" data-i18n="live.value.none">—</td>
            </tr>
            <tr>
              <th data-i18n="live.table.alarm_state">Alarm state</th>
              <td id="live-alarm-state" data-i18n="live.value.none">—</td>
            </tr>
            <tr>
              <th data-i18n="live.table.warning_state">Warning state</th>
              <td id="live-warning-state" data-i18n="live.value.none">—</td>
            </tr>
            <tr>
              <th data-i18n="live.table.data_loss_pending">Data loss pending</th>
              <td id="live-data-loss-pending" data-i18n="live.value.none">—</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div id="live-stations" class="station-grid"></div>
    </section>

    <section class="panel">
      <h2 data-i18n="panel.history.title">History</h2>
      <p data-i18n="panel.history.placeholder">Historical data will appear here.</p>
    </section>

    <section class="panel">
      <h2 data-i18n="panel.reports.title">Reports</h2>
      <p data-i18n="panel.reports.placeholder">Generate and download reports.</p>
      <div class="button-group">
        <button disabled data-i18n="button.reports.csv">CSV</button>
        <button disabled data-i18n="button.reports.json">JSON</button>
      </div>
    </section>
  </main>

  <footer>
    <span data-i18n="footer.version">Version 0.1.0</span>
    <span data-i18n="footer.contractRef">Contract v1.1.1</span>
    <span data-i18n="footer.specRef">Spec v0.7.6</span>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
