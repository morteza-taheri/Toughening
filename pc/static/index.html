<!doctype html>
<html lang="fa" dir="rtl" data-theme="graphite">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Toughening · کنسول پایش خط</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='6' width='14' height='20' rx='3' transform='skewY(-18)' fill='%234fd1b5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/console.css?v=3">
  <script>
    // Apply saved theme before first paint (no flash of the wrong theme).
    try {
      var p = JSON.parse(localStorage.getItem("toughening.console.prefs.v2") || "{}");
      var r = document.documentElement;
      if (p.theme) r.dataset.theme = p.theme;
      if (p.lang === "en") { r.lang = "en"; r.dir = "ltr"; }
    } catch (e) {}
  </script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="view" id="view"></main>
    </div>
  </div>
  <noscript>JavaScript is required for the operator console.</noscript>
  <script type="module" src="/static/js/app.js?v=3"></script>
</body>
</html>
